name: ta_andypos
description: A new Flutter application.

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  esc_pos_printer_plus: ^0.1.1
  esc_pos_utils_plus: ^2.0.4
  escposprinter:
    git:
      url: https://github.com/marcusfelix/esc-pos-printer-flutter.git
      ref: master
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_masked_text2: ^0.9.1
  firebase_storage: ^12.3.3
  image_picker: ^1.1.2
  image: ^4.3.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  webview_flutter: ^4.9.0
  device_info_plus: ^11.1.0
  random_string: ^2.3.1
  flutter_mailer: ^2.0.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  table_calendar: ^3.1.2
  flutter_speed_dial: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.12
  json_serializable: ^6.8.0
  font_awesome_flutter: ^10.7.0
  # flutrans: ^0.0.4
  # flutter_midtrans: ^0.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/login_logo.png
    - assets/person.png
    - assets/complete_payment.png
    - assets/not_active.png
    - assets/item.png

  fonts:
      - family: WorkSansSemiBold
        fonts:
          - asset: assets/fonts/Work_Sans/WorkSans-SemiBold.ttf

      - family: WorkSansBold
        fonts:
          - asset: assets/fonts/Work_Sans/WorkSans-Bold.ttf

      - family: WorkSansMedium
        fonts:
          - asset: assets/fonts/Work_Sans/WorkSans-Medium.ttf
