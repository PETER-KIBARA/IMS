# Enable AndroidX and auto-migrate legacy support dependencies (fixes multidex issue)
android.useAndroidX=true
android.enableJetifier=true

# Allocate 3GB heap for Gradle (optimal for GitHub Actions & local builds, prevents OOM crashes)
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable parallel builds to speed up compilation
org.gradle.parallel=true
org.gradle.caching=true