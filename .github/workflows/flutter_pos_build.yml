name: Flutter Android Build


on:
  push:
    branches:
      - flutter_pos
  pull_request:
    branches:
      - flutter_pos
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Optimized Gradle caching (caches Gradle wrapper, dependencies, and build outputs)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Cache Flutter Pub packages based on pubspec.lock hash
      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      
      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --debug --dart-define=WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}


      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7